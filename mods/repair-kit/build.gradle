base.archivesName = "repair-kit"
group = 'com.sigmundgranaas'
version = project.version

dependencies {
    // Fabric
    modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    // Optional Forgero integration (compile-only for soft dependency)
    compileOnly(project(":modules:core"))
    compileOnly(project(path: ":modules:mc:loader", configuration: 'namedElements'))
    compileOnly(project(path: ":modules:mc:common", configuration: 'namedElements'))

    // Testing dependencies
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.9.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.9.0")
    testImplementation("net.fabricmc:fabric-loader-junit:${project.loader_version}")
}

loom {
    runs {
        testServer {
            server()
            name = "Test Server"
            source sourceSets.test
        }
        gameTest {
            inherit testServer
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
            runDir "build/gameTest"
        }
    }
}

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
    testLogging.events("passed", "skipped", "failed")
}
