archivesBaseName = "vanilla-upgrades"
group = 'com.sigmundgranaas'
version = project.version

dependencies {
    // Core modules (included in JAR)
    include(project(":modules:core"))
    include(project(path: ":modules:mc:common", configuration: 'namedElements'))
    include(project(path: ":modules:mc:loader", configuration: 'namedElements'))
    include(project(path: ":modules:mc:properties", configuration: 'namedElements'))
    include(project(path: ":modules:mc:render", configuration: 'namedElements'))
    include(project(path: ":modules:mc:predicate", configuration: 'namedElements'))

    // Implementation dependencies (for compilation)
    implementation(project(":modules:core"))
    implementation(project(path: ":modules:mc:common", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:loader", configuration: 'namedElements'))

    // Content packs (included in JAR and on runtime classpath for development)
    include(project(":content:forgero-materials"))
    include(project(":content:forgero-upgrades"))
    include(project(":content:vanilla-upgrades-base"))
    runtimeOnly(project(":content:forgero-materials"))
    runtimeOnly(project(":content:forgero-upgrades"))
    runtimeOnly(project(":content:vanilla-upgrades-base"))

    // Fabric
    modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    // Dynamic Resource Pack module (included in JAR)
    include(project(path: ":mods:drp", configuration: 'namedElements'))

    // Recipe Generator module (included in JAR)
    include(project(path: ":mods:recipe-generator", configuration: 'namedElements'))
    implementation(project(path: ":mods:recipe-generator", configuration: 'namedElements'))

    // Testing dependencies
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.9.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.9.0")
    testImplementation("net.fabricmc:fabric-loader-junit:${project.loader_version}")

    // Test runtime needs drp and recipe-generator mods
    testRuntimeOnly(project(path: ":mods:drp", configuration: 'namedElements'))
    testRuntimeOnly(project(path: ":mods:recipe-generator", configuration: 'namedElements'))
}

loom {
    runs {
        testServer {
            server()
            name = "Test Server"
            source sourceSets.test
        }
        gameTest {
            inherit testServer
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
            runDir "build/gameTest"
        }
    }
}

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
    testLogging.events("passed", "skipped", "failed")
}
