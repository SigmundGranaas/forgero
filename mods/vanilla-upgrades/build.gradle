base.archivesName = "vanilla-upgrades"
group = 'com.sigmundgranaas'
version = project.version

dependencies {
    // === SHARED FOUNDATION ===
    // forgero-loader provides the initialization system and core APIs
    // Included in JAR - Fabric's jar-in-jar will deduplicate if forgero is also loaded
    include(project(path: ":modules:mc:loader", configuration: 'namedElements'))

    // Core content packs
    include(project(":content:forgero-base"))
    include(project(":content:forgero-materials"))

    // === VANILLA-UPGRADES SPECIFIC MODULES (bundled in JAR) ===
    include(project(":modules:core"))
    include(project(path: ":modules:mc:common", configuration: 'namedElements'))
    include(project(path: ":modules:mc:properties", configuration: 'namedElements'))
    include(project(path: ":modules:mc:render", configuration: 'namedElements'))
    include(project(path: ":modules:mc:predicate", configuration: 'namedElements'))
    include(project(path: ":modules:mc:tools", configuration: 'namedElements'))
    // Station blocks (Upgrade Station) — the in-game mechanism for installing/removing upgrades.
    include(project(path: ":modules:mc:blocks", configuration: 'namedElements'))

    // Implementation dependencies (for compilation and development runtime)
    implementation(project(":modules:core"))
    implementation(project(path: ":modules:mc:common", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:loader", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:properties", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:tools", configuration: 'namedElements'))
    modImplementation(project(path: ":modules:mc:render", configuration: 'namedElements'))
    modImplementation(project(path: ":modules:mc:blocks", configuration: 'namedElements'))

    // === VANILLA-UPGRADES SPECIFIC CONTENT (bundled in JAR) ===
    // Note: Material upgrade bases are in forgero-base
    include(project(":content:vanilla-upgrades-base"))
    // Ranged-weapon slots (bow/crossbow) — vanilla-upgrades-only, kept out of the shared base pack
    // so it never loads under the main Forgero mod (whose bows module owns minecraft:bow).
    include(project(":content:vanilla-upgrades-ranged"))
    // Gem upgrades — fillers for the gem slots on vanilla tools.
    include(project(":content:forgero-gems"))
    // Secondary materials — provide stat-applying upgrade materials (ender_pearl, glowstone, etc.)
    // whose attributes actually propagate when slotted (unlike the part-composite-scoped gems).
    include(project(":content:forgero-secondary-materials"))
    // Slot-conditioned upgrade bonuses merged onto materials so reinforcement/binding/lining buff.
    include(project(":content:vanilla-upgrades-stats"))

    // Core content runtimeOnly for development
    runtimeOnly(project(":content:forgero-base"))
    runtimeOnly(project(":content:forgero-materials"))
    runtimeOnly(project(":content:forgero-gems"))
    runtimeOnly(project(":content:forgero-secondary-materials"))
    runtimeOnly(project(":content:vanilla-upgrades-stats"))
    runtimeOnly(project(":content:vanilla-upgrades-base"))
    runtimeOnly(project(":content:vanilla-upgrades-ranged"))

    // Fabric
    modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    // Dynamic Resource Pack module (included in JAR)
    include(project(path: ":mods:drp", configuration: 'namedElements'))
    modImplementation(project(path: ":mods:drp", configuration: 'namedElements'))

    // Recipe Generator module (included in JAR)
    include(project(path: ":mods:recipe-generator", configuration: 'namedElements'))
    modImplementation(project(path: ":mods:recipe-generator", configuration: 'namedElements'))

    // Testing dependencies
    testImplementation(project(path: ":modules:mc:test-common", configuration: 'namedElements'))
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.9.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.9.0")
    testImplementation("net.fabricmc:fabric-loader-junit:${project.loader_version}")

    // Test runtime needs drp and recipe-generator mods
    testRuntimeOnly(project(path: ":mods:drp", configuration: 'namedElements'))
    testRuntimeOnly(project(path: ":mods:recipe-generator", configuration: 'namedElements'))
    // Station blocks + gem content for tests (install flow + slot fillability)
    testRuntimeOnly(project(path: ":modules:mc:blocks", configuration: 'namedElements'))
    testRuntimeOnly(project(":content:forgero-gems"))
    testRuntimeOnly(project(":content:forgero-secondary-materials"))
    testRuntimeOnly(project(":content:vanilla-upgrades-stats"))
    testRuntimeOnly(project(":content:vanilla-upgrades-ranged"))
    // Example extension pack (proves a separate pack can add slots to existing items) — test only.
    testRuntimeOnly(project(":content:vanilla-upgrades-example-extension"))
}

loom {
    runs {
        testServer {
            server()
            name = "Test Server"
            source sourceSets.test
        }
        gameTest {
            inherit testServer
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
            runDir "build/gameTest"
        }
    }
}

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
    testLogging.events("passed", "skipped", "failed")
}
