//file:noinspection GroovyAccessibility
//file:noinspection GroovyAssignabilityCheck
//file:noinspection DependencyNotationArgument

// Ensure drp is evaluated first to avoid configuration-time JAR resolution issues
evaluationDependsOn ':mods:drp'

base.archivesName = "recipe-generator"
group = 'com.sigmundgranaas'
version = project.version

dependencies {
	// Fabric
	modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
	modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

	// DRP dependency for integration
	// Use implementation (not modImplementation) to avoid configuration-time JAR access
	// namedElements provides already-remapped classes from the Loom project
	implementation(project(path: ":mods:drp", configuration: 'namedElements'))

	// Unit Testing
	testImplementation("org.junit.jupiter:junit-jupiter-api:5.9.0")
	testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.9.0")
}

loom {
	runs {
		testServer {
			server()
			name = "Test Server"
			source sourceSets.test
		}
		gameTest {
			inherit testServer
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			runDir "build/gameTest"
		}
	}
}

sourceSets {
	test {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
	}
}

test {
	useJUnitPlatform()
	maxParallelForks = 16
	testLogging.events("failed")
	testLogging.info.events = ["failed", "skipped"]

	// Exclude GameTests and testutil from regular JUnit testing
	// GameTests run via runGameTest task instead
	exclude '**/gametest/**'
	exclude '**/testutil/**'
}
