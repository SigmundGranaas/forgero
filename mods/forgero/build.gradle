plugins {
    id "com.modrinth.minotaur" version "2.+"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

archivesBaseName = "forgero"
group = 'com.sigmundgranaas'
version = project.version

// Exclude non-remapped fabric-api from non-mod configurations to prevent classpath pollution
// The remapped fabric-api from modImplementation will still be included
configurations.matching { !it.name.startsWith('mod') }.all {
    exclude group: 'net.fabricmc.fabric-api'
}

dependencies {
    // Core modules (included in JAR)
    include(project(":modules:core"))
    include(project(path: ":modules:mc:common", configuration: 'namedElements'))
    include(project(path: ":modules:mc:loader", configuration: 'namedElements'))
    include(project(path: ":modules:mc:properties", configuration: 'namedElements'))
    include(project(path: ":modules:mc:render", configuration: 'namedElements'))
    include(project(path: ":modules:mc:predicate", configuration: 'namedElements'))
    include(project(path: ":modules:mc:blocks", configuration: 'namedElements'))

    // Forgero-specific modules (custom tool/armor/bow items)
    include(project(path: ":modules:mc:tools", configuration: 'namedElements'))
    include(project(path: ":modules:mc:armor", configuration: 'namedElements'))
    include(project(path: ":modules:mc:bows", configuration: 'namedElements'))

    // Dynamic Resource Pack module (included in JAR)
    include(project(path: ":mods:drp", configuration: 'namedElements'))

    // Recipe Generator module (included in JAR)
    include(project(path: ":mods:recipe-generator", configuration: 'namedElements'))
    implementation(project(path: ":mods:recipe-generator", configuration: 'namedElements'))

    // Implementation dependencies (for compilation and development runtime)
    implementation(project(":modules:core"))
    implementation(project(path: ":modules:mc:common", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:loader", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:properties", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:render", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:predicate", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:blocks", configuration: 'namedElements'))
    implementation(project(path: ":mods:drp", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:tools", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:armor", configuration: 'namedElements'))
    implementation(project(path: ":modules:mc:bows", configuration: 'namedElements'))

    // Content modules for testing - use same content as properties module for stability
    runtimeOnly(project(":content:forgero-materials"))
    runtimeOnly(project(":content:minecraft-tools"))
    runtimeOnly(project(":content:forgero-base"))
    runtimeOnly(project(":content:forgero-upgrades"))

    // Fabric
    modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    // Reach entity attributes API
    include modApi("com.jamieswhiteshirt:reach-entity-attributes:${project.reach_entity_attributes_version}")

    // Testing dependencies
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.9.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.9.0")
    testImplementation("net.fabricmc:fabric-loader-junit:${project.loader_version}")

    // Forgero test utilities
    testImplementation(project(":modules:core:test-common"))
    implementation(project(path: ":modules:mc:test-common", configuration: 'namedElements'))
    // Include test-common in the mod jar for gametest runtime
    include(project(path: ":modules:mc:test-common", configuration: 'namedElements'))

    // Add vanilla-upgrades content for vanilla parity testing (include for GameTests)
    include(project(":content:vanilla-upgrades-base"))
    runtimeOnly(project(":content:vanilla-upgrades-base"))
}

loom {
    runs {
        gameTest {
            server()
            name "Game Test"
            source sourceSets.test
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
            runDir "build/gameTest"
            // Use ideConfigGenerated to avoid inheriting problematic classpaths
            ideConfigGenerated = false
        }
    }
}

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

// GameTests are the primary test mechanism for this module.
// Running :mods:forgero:test will execute GameTests via runGameTest.
test {
    dependsOn runGameTest
    // Skip the regular JUnit test execution since we use GameTests
    exclude '**/*'
}

// CurseForge publishing
curseforge {
    apiKey = System.getenv("CURSEFORGE_API_KEY") ?: ""
    project {
        id = '581435'
        changelogType = "markdown"
        changelog = file('../../changelog.md')

        releaseType = project.release_type
        addGameVersion project.minecraft_version
        addGameVersion 'Fabric'
        addGameVersion 'Quilt'
        addGameVersion "Java 17"

        mainArtifact(remapJar) {
            displayName = "Forgero [Fabric]: $version"
            relations {
                requiredDependency 'fabric-api'
                optionalDependency 'modonomicon'
                optionalDependency "lambdynamiclights"
                optionalDependency "better-combat"
                optionalDependency "modmenu"
                optionalDependency "mythicmetals"
                optionalDependency "betternether"
                optionalDependency "betterend"
                optionalDependency "mystical-crops"
                optionalDependency "natures-spirit"
                optionalDependency "create"
                optionalDependency "ad-astra"
                optionalDependency "deeperdarker"
                optionalDependency "ecologics"
                optionalDependency "naturalist"
                optionalDependency "advanced-netherite"
                optionalDependency "modern-industrialization"
                optionalDependency "oh-the-biomes-weve-gone"
                optionalDependency "techreborn"
                optionalDependency "lets-do-bloomingnature"
                optionalDependency "lets-do-beachparty"
                optionalDependency "lets-do-vinery"
                optionalDependency "lets-do-nethervinery"
                optionalDependency "gardens-of-the-dead"
                optionalDependency "ribbits"
                optionalDependency "dragonloot"
                optionalDependency "garnished-additions"
                optionalDependency "mythicmetals-decorations"
                optionalDependency "eldritch-end"
                optionalDependency "regions-unexplored"
                optionalDependency "spelunkery"
                optionalDependency "beneath-the-wetlands"
                optionalDependency "enderite-mod"
                optionalDependency "galosphere"
                optionalDependency "eden-ring-reforked"
                incompatible "exordium"
            }
        }
    }
    options {
        forgeGradleIntegration = false
    }
}

// Modrinth publishing
modrinth {
    token = System.getenv("MODRINTH_TOKEN")

    projectId = "forgero"
    versionNumber = version
    versionType = project.release_type
    uploadFile = remapJar
    gameVersions = [minecraft_version]
    loaders = ["fabric", "quilt"]
    versionName = "Forgero $version"
    changelog = file('../../changelog.md').exists() ? file('../../changelog.md').text : "Release $version"
    dependencies {
        required.project "fabric-api"
        optional.project "modonomicon"
        optional.project "lambdynamiclights"
        optional.project "better-combat"
        optional.project "modmenu"
        optional.project "mythicmetals"
        optional.project "betternether"
        optional.project "mystical_crops"
        optional.project "wiredredstone"
        optional.project "natures-spirit"
        optional.project "create"
        optional.project "ad-astra"
        optional.project "betterend"
        optional.project "deeperdarker"
        optional.project "ecologics"
        optional.project "naturalist"
        optional.project "advanced-netherite"
        optional.project "oh-the-biomes-weve-gone"
        optional.project "modern-industrialization"
        optional.project "lets-do-bloomingnature"
        optional.project "fruitful-fun"
        optional.project "lets-do-beachparty"
        optional.project "lets-do-nethervinery"
        optional.project "lets-do-vinery"
        optional.project "gardens-of-the-dead"
        optional.project "ribbits"
        optional.project "dragonloot"
        optional.project "garnished-additions"
        optional.project "mythicmetals-decorations"
        optional.project "eldritch-end"
        optional.project "regions-unexplored"
        optional.project "spelunkery"
        optional.project "ends-phantasm"
        optional.project "enderite-mod"
        optional.project "galosphere"
        optional.project "bountiful-fares"
        optional.project "eden-ring-reforked"
        optional.project "beneath-the-wetlands"
        incompatible.project "exordium"
    }
}

tasks.register('publishToModrinthAndCurseForge') {
    dependsOn 'modrinth', 'curseforge'
}
