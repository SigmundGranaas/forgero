//file:noinspection GroovyAccessibility
//file:noinspection GroovyAssignabilityCheck

plugins {
	id 'jacoco'
}

dependencies {
	// Core APIs only - no impl access
	api(project(":modules:core"))
	api(project(":modules:model"))

	// DataFixerUpper for Codec system (transitive from core, but explicit for clarity)
	api("com.mojang:datafixerupper:${project.data_fixer_upper_version}")

	// Logging
	implementation("org.slf4j:slf4j-api:1.7.25")

	// JUnit for testing
	testImplementation("org.junit.jupiter:junit-jupiter-api:5.9.0")
	testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.9.0")
	testImplementation("com.github.valfirst:slf4j-test:3.0.1")
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = "0.8.11"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

java {
	withSourcesJar()
}
