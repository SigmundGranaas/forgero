//file:noinspection GroovyAccessibility
//file:noinspection GroovyAssignabilityCheck
//file:noinspection DependencyNotationArgument

dependencies {
	// === CORE MODULES ===
	implementation(project(":modules:core"))
	implementation(project(":modules:model"))
	implementation(project(path: ":modules:mc:common", configuration: 'namedElements'))
	implementation(project(path: ":modules:mc:loader", configuration: 'namedElements'))

	// === ALL MC MODULES (for testing both forgero and vanilla-upgrades) ===
	runtimeOnly(project(path: ":modules:mc:armor", configuration: 'namedElements'))
	runtimeOnly(project(path: ":modules:mc:tools", configuration: 'namedElements'))
	runtimeOnly(project(path: ":modules:mc:render", configuration: 'namedElements'))
	runtimeOnly(project(path: ":modules:mc:properties", configuration: 'namedElements'))
	runtimeOnly(project(path: ":modules:mc:predicate", configuration: 'namedElements'))
	runtimeOnly(project(path: ":modules:mc:bows", configuration: 'namedElements'))
	runtimeOnly(project(path: ":modules:mc:blocks", configuration: 'namedElements'))

	// === SHARED CORE CONTENT (required for both mods) ===
	runtimeOnly(project(":content:forgero-base"))
	runtimeOnly(project(":content:forgero-materials"))
	runtimeOnly(project(":content:forgero-conditions"))

	// === FORGERO-SPECIFIC CONTENT ===
	runtimeOnly(project(":content:forgero-armor"))
	runtimeOnly(project(":content:forgero-armor-content"))
	runtimeOnly(project(":content:minecraft-tools"))
	runtimeOnly(project(":content:forgero-mastercrafted"))
	runtimeOnly(project(":content:forgero-extended-schematics"))
	runtimeOnly(project(":content:forgero-secondary-materials"))
	runtimeOnly(project(":content:forgero-extended-weapons"))
	runtimeOnly(project(":content:forgero-gems"))
	runtimeOnly(project(":content:forgero-bows"))

	// === VANILLA-UPGRADES CONTENT ===
	runtimeOnly(project(":content:vanilla-upgrades-base"))

	// Fabric
	modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
	modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

	// Dynamic Resource Pack module
	runtimeOnly(project(path: ":mods:drp", configuration: 'namedElements'))

	// Recipe Generator module
	runtimeOnly(project(path: ":mods:recipe-generator", configuration: 'namedElements'))

	// Testing
	testImplementation("org.junit.jupiter:junit-jupiter-api:5.9.0")
	testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.9.0")
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

sourceSets {
	test {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
	}
}

// Configure runClient to pass all source resource paths as a system property
tasks.named('runClient', JavaExec) {
	def resourceDirs = []
	// Add this module's own resources
	sourceSets.main.resources.srcDirs.each { resourceDirs.add(it.absolutePath) }

	// Iterate through all project dependencies on the runtime classpath
	configurations.runtimeClasspath.allDependencies.each { dep ->
		if (dep instanceof ProjectDependency) {
			def dependentProject = project(dep.dependencyProject.path)
			dependentProject.sourceSets.main.resources.srcDirs.each { resourceDirs.add(it.absolutePath) }
		}
	}

	// Join unique paths with the system's path separator
	def resourcePathsString = resourceDirs.unique().join(File.pathSeparator)

	// Set system properties for the running game
	systemProperty 'forgero.dev.hotReload', 'true'
	systemProperty 'forgero.dev.resourcePaths', resourcePathsString
}


test {
	useJUnitPlatform()
	maxParallelForks = 32
	testLogging.events("failed")
	testLogging.info.events = ["failed", "skipped"]
}
