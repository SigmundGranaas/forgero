pluginManagement {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		gradlePluginPortal()
	}
}

rootProject.name = "${mod_id}"

// Core (Legacy - Read Only)
include("${mod_id}-core-legacy-read-only")

// Modules
include ("modules")
include("modules:core")
include("modules:core:test-common")
include("modules:model")
include("modules:validation")

// MC modules
include("modules:mc")
include "modules:mc:armor"
include "modules:mc:tools"
include "modules:mc:common"
include "modules:mc:render"
include "modules:mc:loader"
include "modules:mc:properties"
include "modules:mc:predicate"
include "modules:mc:development"
include "modules:mc:bows"
include "modules:mc:blocks"
include "modules:mc:trades"
include "modules:mc:test-common"
// DRP is a standalone mod - see mods:drp

// Content - New Structure (clean modules for new mods)
include("content")
include("content:forgero-materials")
include("content:forgero-conditions")  // Random item modifier conditions (sharp, durable, etc.)
include("content:forgero-base")
include("content:vanilla-upgrades-base")
include("content:vanilla-upgrades-ranged")  // Vanilla bow/crossbow slots (vanilla-upgrades mod only)
include("content:vanilla-upgrades-stats")   // Slot-conditioned upgrade bonuses (vanilla-upgrades mod only)
include("content:vanilla-upgrades-example-extension")  // Demo: a pack adding a slot to an existing item (test only)
include("content:forgero-extended-weapons")  // Extended weapon parts AND mining tools (hammer, spade, etc.)
include("content:forgero-gems")
include("content:forgero-mastercrafted")  // Quality schematics (refined, mastercrafted)
include("content:forgero-secondary-materials")  // Secondary materials (soft, hard, hybrid, dyes)
include("content:forgero-extended-schematics")  // Extended schematics (weapon blades, tool heads, guards, bindings)
include("content:forgero-bows")  // Bow and arrow content

// Content - Standalone modules (armor, structures)
include("content:forgero-armor-content")
include("content:${mod_id}-armor")
include("content:${mod_id}-structures")

include("content:minecraft-tools")

// Mods
include 'mods:drp'
include 'mods:recipe-generator'
include 'mods:vanilla-upgrades'
include 'mods:forgero'
include 'mods:repair-kit'

// LEGACY - Read Only
// Fabric (Legacy)
include "fabric-legacy-read-only"
include "fabric-legacy-read-only:${mod_id}-fabric-core"
include "fabric-legacy-read-only:${mod_id}-fabric-compat"
include "fabric-legacy-read-only:minecraft-common"

// Old Modules (Legacy)
include 'mods'
include "fabric-legacy-read-only:modules"
include "fabric-legacy-read-only:modules:bows"
include "fabric-legacy-read-only:modules:trade"
include "fabric-legacy-read-only:modules:generator"

