pluginManagement {
	repositories {
		maven { url "https://maven.fabricmc.net/" }
		gradlePluginPortal()
	}
}

rootProject.name = "${mod_id}"

// Core
include("${mod_id}-core")

// Modules
include ("modules")
include("modules:core")
include("modules:core:test-common")
include("modules:model")

// MC modules
include("modules:mc")
include "modules:mc:armor"
include "modules:mc:tools"
include "modules:mc:common"
include "modules:mc:render"
include "modules:mc:loader"
include "modules:mc:properties"
include "modules:mc:predicate"
include "modules:mc:development"
include "modules:mc:bows"
include "modules:mc:blocks"
include "modules:mc:test-common"
// DRP is a standalone mod - see mods:drp

// Content - New Structure (clean modules for new mods)
include("content")
include("content:forgero-materials")
include("content:forgero-upgrades")
include("content:forgero-base")
include("content:vanilla-upgrades-base")
include("content:forgero-extended-weapons")
include("content:forgero-mining")
include("content:forgero-gems")
include("content:forgero-schematics")  // Extended schematics (mastercrafted, refined)

// Content - Standalone modules (armor, compat, structures)
include("content:forgero-armor-content")
include("content:${mod_id}-extended")
include("content:${mod_id}-compat")
include("content:${mod_id}-armor")
include("content:${mod_id}-structures")

// Content - Legacy (to be removed after recipe generators migrated)
include("content:${mod_id}-vanilla")
include("content:${mod_id}-tools")
include("content:minecraft-tools")
include("content:${mod_id}-deprecated")

// Mods
include 'mods:drp'
include 'mods:recipe-generator'
include 'mods:vanilla-upgrades'
include 'mods:forgero'
include 'mods:repair-kit'

// LEGACY
// Fabric
include "fabric"
include "fabric:${mod_id}-fabric-core"
include "fabric:${mod_id}-fabric-compat"
include "fabric:minecraft-common"

// Old Modules
include 'mods'
include "fabric:modules"
include "fabric:modules:bows"
include "fabric:modules:trade"
include "fabric:modules:generator"

